name: Get Citation Data

on:
  workflow_dispatch:          # Allow manual runs
  schedule:
    - cron: '17 8 * * *'      # Once per day, UTC 08:17

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          PYTHONUNBUFFERED: '1'
        run: |
          python main.py

      # This step runs only if fetching succeeded. Old data is untouched on failure.
      - name: Publish validated citation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          src="${GITHUB_WORKSPACE}/google_scholar_crawler/results"
          test -s "${src}/gs_data.json"
          test -s "${src}/gs_data_shieldsio.json"
          python -m json.tool "${src}/gs_data.json" >/dev/null
          python -m json.tool "${src}/gs_data_shieldsio.json" >/dev/null

          mkdir -p /tmp/scholar-publish
          cd /tmp/scholar-publish
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin google-scholar-stats >/dev/null; then
            git fetch --depth=1 origin google-scholar-stats
            git checkout -b google-scholar-stats FETCH_HEAD
          else
            git checkout --orphan google-scholar-stats
          fi

          cp "${src}/gs_data.json" ./gs_data.json
          cp "${src}/gs_data_shieldsio.json" ./gs_data_shieldsio.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "Data did not change; nothing to commit."
            exit 0
          fi

          git commit -m "Update Google Scholar citation data"
          git push origin HEAD:refs/heads/google-scholar-stats
